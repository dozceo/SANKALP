name: Auto-review and merge report/markdown PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-review-and-merge:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Classify changed files
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const isSafePath = (file) =>
              !file.filename.startsWith('/') && !file.filename.split('/').includes('..');
            const isMarkdown = (file) => isSafePath(file) && file.filename.endsWith('.md');
            const isNewScript =
              (file) => isSafePath(file) && file.status === 'added' && /^scripts\/[^/.][^/]*$/.test(file.filename);
            const eligible = files.length > 0 && files.every((file) => isMarkdown(file) || isNewScript(file));

            core.setOutput('eligible', eligible ? 'true' : 'false');
            core.info(`Eligible for auto-review/merge: ${eligible}`);
            if (!eligible) {
              core.info('Changed files:');
              for (const file of files) core.info(`- ${file.status}: ${file.filename}`);
            }

      - name: Approve eligible PR
        if: steps.classify.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                event: 'APPROVE',
                body: '[Automated] Auto-approved: this PR only updates Markdown files and/or adds scripts under scripts/.',
              });
              core.info('Approval review submitted.');
            } catch (error) {
              core.warning(`Could not submit approval (possibly already approved): ${error.message}`);
            }

      - name: Enable auto-merge for eligible PR
        if: steps.classify.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            try {
              await github.graphql(`
                mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) {
                    clientMutationId
                  }
                }
              `, {
                pullRequestId: pr.node_id,
              });
              core.info('Auto-merge enabled.');
            } catch (error) {
              core.warning(`Could not enable auto-merge: ${error.message}`);
            }
